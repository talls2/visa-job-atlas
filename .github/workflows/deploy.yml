name: Refresh jobs and deploy

# Every morning: refresh the sponsor registers (weekly), poll the job boards and
# feeds, export the site data, build the app and publish it to GitHub Pages.
# A push to main redeploys the app from the cached database without re-polling.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      poll:
        description: "Poll the job boards (otherwise reuse the cached data)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The SQLite history (first-seen dates, closed postings) and the register
      # downloads live in the Actions cache between runs.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Poll job boards and export
        working-directory: pipeline
        env:
          POLL: ${{ github.event_name == 'schedule' || inputs.poll || hashFiles('pipeline/data/atlas.db') == '' }}
        run: |
          if [ "$POLL" = "true" ]; then
            python -m jobtracker run
          else
            python -m jobtracker export
          fi
          python -m jobtracker trend | tail -n 5

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
